worker_processes 1;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 15;
    server_tokens off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location = /health {
            default_type text/plain;
            add_header Cache-Control "no-store";
            return 200 "ok
";
        }

        location = /api/status {
            default_type application/json;
            add_header Cache-Control "no-store";
            return 200 '{"status":"online","app":"Pi Node Monitor","version":"1.1.0","container":"not-configured","node":"not-connected","port":8080}';
        }

        location = /status {
            default_type text/html;
            add_header Cache-Control "no-store";
            try_files /status.html =404;
        }

        location = / {
            add_header Cache-Control "no-store";
            try_files /index.html =404;
        }

        location = /index.html {
            add_header Cache-Control "no-store";
            try_files /index.html =404;
        }

        location = /app.js {
            add_header Cache-Control "no-store";
            try_files /app.js =404;
        }

        location = /style.css {
            add_header Cache-Control "no-store";
            try_files /style.css =404;
        }

        location / {
            try_files $uri =404;
        }
    }
}
