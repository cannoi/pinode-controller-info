services:
  pi-node-solohost:
    build:
      context: .
    image: pi-node-solohost:1.1.0
    container_name: pi-node-solohost
    restart: unless-stopped
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
